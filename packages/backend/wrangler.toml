#:schema node_modules/wrangler/config-schema.json
name = "my-app-backend"
main = "src/index.ts"
compatibility_date = "2024-04-03"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://seat-check.pages.dev"

[triggers]
# 3回/日。CronはUTCで実行される（JST 09:17 / 17:17 / 01:17）。
crons = ["17 0,8,16 * * *"]

[[d1_databases]]
binding = "DB"
database_name = "my-db"
database_id = "66fd0138-63fe-4e38-bb76-9e2e69e31e6f"
migrations_dir = "migrations"
